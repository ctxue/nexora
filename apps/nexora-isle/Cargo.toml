[package]
name = "nexora-isle"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "NEXORA ISLE: a focused Windows desktop information island"
repository = "https://github.com/ctxue/nexora"
default-run = "nexora-isle"

[lib]
name = "nexora_isle"
path = "src/lib.rs"

[[bin]]
name = "nexora-isle"
path = "src/main.rs"

[patch.crates-io]
imap-proto = { path = "vendor/imap-proto" }

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["glow", "wgpu", "default_fonts"] }
egui_extras = { version = "0.31", default-features = false, features = ["svg", "image"] }
ureq = { version = "2.12", default-features = false, features = ["tls", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
flate2 = "1"
ring = "0.17"
image = { version = "0.25", default-features = false, features = ["bmp", "jpeg", "png", "webp"] }
raw-window-handle = "0.6"
mailparse = "0.18"
regex = "1"
url = "2"
chrono = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts", "x11"] }

[target.'cfg(windows)'.dependencies]
clipboard-win = "5.4.3"
wgpu = { version = "24", default-features = false, features = ["dx12"] }
memmap2 = "0.9.12"
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_System_Power",
  "Win32_System_Performance",
  "Win32_System_ProcessStatus",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_Storage_FileSystem",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Input_Ime", "Win32_UI_TextServices",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Media_Control",
  "Foundation",
  "Foundation_Collections",
  "Storage_Streams",
  "Win32_Media_Audio_Endpoints",
  "Win32_Media_Audio",
  "Win32_System_WinRT",
  "UI_Notifications_Management",
  "UI_Notifications", "ApplicationModel",
  "Win32_System_Ole", "Win32_UI_Shell_Common", "Networking_Connectivity",
  "Win32_Devices_DeviceAndDriverInstallation",
  "Win32_Devices_Properties",
  "Win32_Devices_Bluetooth",
  "Devices_Bluetooth", "Devices_Enumeration",
] }
# Pin the maintained nom 7 parser line until the 3.x stable release.
imap = "=3.0.0-alpha.15"
imap-proto = "0.16.1"
native-tls = "0.2"
keyring = { version = "3", features = ["windows-native"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
