name: NEXORA Combined Release

on:
  push:
    tags:
      - "v*"
      - "release-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run workspace workflow tests
        run: pnpm test:workspace

      - name: Run launcher tests
        run: pnpm test:launcher

      - name: Run Isle tests
        run: pnpm test:isle

      - name: Build and package release
        run: pnpm package:all

      - name: Check legacy artifact names
        run: pnpm check:workspace

      - name: Verify packaged files
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -LiteralPath release -File)
          if ($files.Count -ne 4) { throw "Expected four release files, found $($files.Count)." }
          if (@($files | Where-Object { $_.Name -notmatch '^NEXORA_(LAUNCHER|ISLE)_.+_(x64_setup\.exe|portable\.zip)$' }).Count) {
            throw "Unexpected release file name."
          }

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release/*
