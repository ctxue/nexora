name: NEXORA Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend and release workflow tests
        run: pnpm test

      - name: Test release workflow
        run: pnpm test:scripts

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Lint Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build and package release
        run: pnpm package

      - name: Verify packaged files
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -LiteralPath release -File)
          if ($files.Count -ne 2) { throw "Expected two release files, found $($files.Count)." }
          if (@($files | Where-Object { $_.Name -notmatch '^NEXORA_LAUNCHER_.+_(x64_setup\.exe|portable\.zip)$' }).Count) {
            throw "Unexpected release file name."
          }

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -LiteralPath release -File | Sort-Object Name)
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          Set-Content -LiteralPath release/SHA256SUMS.txt -Value $lines -Encoding ascii

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release/*
