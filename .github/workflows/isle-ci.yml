name: NEXORA ISLE CI
on:
  push:
    paths:
      - "apps/nexora-isle/**"
      - "scripts/check-workspace-hygiene.ps1"
      - ".github/workflows/isle-ci.yml"
  pull_request:
    paths:
      - "apps/nexora-isle/**"
      - "scripts/check-workspace-hygiene.ps1"
      - ".github/workflows/isle-ci.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/nexora-isle
    env:
      CARGO_BUILD_JOBS: 1
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Rust stable
        run: rustup toolchain install stable --profile minimal
      - name: 测试
        run: cargo +stable test --locked --all-targets --target x86_64-pc-windows-msvc -- --test-threads=1
      - name: 构建并检查发布运行库
        shell: pwsh
        run: |
          cargo +stable build --locked --release --bin nexora-isle --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw '发布构建失败' }
          ./scripts/check-runtime.ps1 -Executable ./target/x86_64-pc-windows-msvc/release/nexora-isle.exe
      - name: 检查旧产品构建残留
        working-directory: ${{ github.workspace }}
        shell: pwsh
        run: ./scripts/check-workspace-hygiene.ps1
      - name: 检查安装脚本语法
        shell: pwsh
        run: |
          Get-ChildItem installer,scripts -Filter *.ps1 -Recurse | ForEach-Object {
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$null,[ref]$parseErrors) | Out-Null
            if ($parseErrors) { throw ($parseErrors | Out-String) }
          }
      - name: 验证发布打包
        shell: pwsh
        run: |
          $compiler = ./scripts/get-nsis.ps1 -Directory $env:RUNNER_TEMP
          ./scripts/package.ps1 -SkipBuild -NsisCompiler $compiler
  installer:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/nexora-isle
    steps:
      - uses: actions/checkout@v4
      - name: 验证安装、升级与卸载
        shell: pwsh
        run: |
          $compiler = ./scripts/get-nsis.ps1 -Directory $env:RUNNER_TEMP
          ./tests/native_installer.ps1 -NsisCompiler $compiler
          ./tests/update_installer.ps1
          exit 0
